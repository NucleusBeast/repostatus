[package]
name = "repostatus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Git projects dashboard built with Iced"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "x11", "wayland", "tokio"] }
rfd = "0.17"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.bundle]
name = "RepoStatus"
identifier = "com.nucleusbeast.repostatus"
icon = ["assets/icon.icns"]
category = "Productivity"
short_description = "See the satus of your local repositories. Helpfull when working on a multiple devices."
